<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digitální audit — JUSDA Europe s.r.o.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: #f4f6f9; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 18px; color: #2d4173; }
  </style>
</head>
<body>
  <div id="root"><div id="loading">Načítání dashboardu…</div></div>

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Prop-types (Recharts dependency) -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <!-- Recharts UMD -->
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <script>
    // Wait for all scripts to load
    (function() {
      var e = React.createElement;
      var root = ReactDOM.createRoot(document.getElementById("root"));

      // Recharts components
      var RC = Recharts;
      var PieChart = RC.PieChart, Pie = RC.Pie, Cell = RC.Cell;
      var BarChart = RC.BarChart, Bar = RC.Bar, XAxis = RC.XAxis, YAxis = RC.YAxis;
      var CartesianGrid = RC.CartesianGrid, Tooltip = RC.Tooltip;
      var ResponsiveContainer = RC.ResponsiveContainer;
      var RadarChart = RC.RadarChart, PolarGrid = RC.PolarGrid;
      var PolarAngleAxis = RC.PolarAngleAxis, PolarRadiusAxis = RC.PolarRadiusAxis;
      var Radar = RC.Radar, Legend = RC.Legend;

      var COLORS = {
        primary: "#2d4173", secondary: "#62c4dd", accent: "#ffcc00",
        critical: "#e85252", success: "#27ae60", warning: "#f39c12",
        bg: "#f4f6f9", card: "#ffffff", text: "#2d3748",
        textLight: "#718096", border: "#e2e8f0",
      };
      var SEGMENT_COLORS = [COLORS.primary, COLORS.secondary, COLORS.accent, COLORS.critical];
      var AI_COLORS = [COLORS.primary, COLORS.secondary, COLORS.accent, COLORS.critical];
      var SECURITY_COLORS = [COLORS.success, COLORS.warning, COLORS.critical];
      var font = "'Arial', sans-serif";

      var DATA = {
        orgName: "JUSDA Europe s.r.o.",
        date: "19. 01. – 11. 02. 2026",
        respondents: { total: 85, employees: 100, rate: "85" },
        baselineMetrics: [
          { name: "AI adopce", value: 77.6, target: 30, unit: "%", status: "ok" },
          { name: "Bezpečnostní skóre", value: 7.1, target: 70, unit: "%", status: "critical" },
          { name: "Pool ambasadorů", value: 29.4, target: 15, unit: "%", status: "ok" },
          { name: "Produktivitní dluh", value: 80.0, target: 30, unit: "%", status: "critical", inverse: true },
          { name: "Spokojenost s nástroji", value: 3.5, target: 3.5, unit: "/5", status: "warning" },
          { name: "Ochota ke změně", value: 78.8, target: 60, unit: "%", status: "ok" },
          { name: "Komunikační efektivita", value: 54.1, target: 50, unit: "%", status: "ok" },
        ],
        changeSegments: [
          { name: "Průkopníci", value: 38, desc: "Aktivně experimentují, zkouší nové přístupy z vlastní iniciativy. Pravidelně radí kolegům." },
          { name: "Následovníci", value: 34, desc: "Přizpůsobí se bez problémů. Potřebují komunitu a příklady, aby se aktivněji zapojili." },
          { name: "Opatrní", value: 21, desc: "Zvládnou změny, ale potřebují čas a pomoc. Chtějí pochopit smysl a logiku změny." },
          { name: "Resistentní", value: 7, desc: "Pasivní přístup, vyčkávají. Změny je stresují. Potřebují individuální podporu." },
        ],
        aiSegments: [
          { name: "AI Průkopníci", value: 54, desc: "Pravidelně používají AI, pozitivní postoj, využívají i zabudované AI funkce." },
          { name: "AI Curious", value: 21, desc: "Zvědaví, občas zkouší. Potřebují praktické příklady a prostor k experimentování." },
          { name: "AI Skeptici", value: 18, desc: "Zkusili nebo přemýšlí, ale nejsou přesvědčeni. Chtějí důkazy přínosu." },
          { name: "AI Odmítači", value: 7, desc: "Nepoužívají AI a nemají zájem nebo mají obavy. Vyžadují individuální přístup." },
        ],
        securitySegments: [
          { name: "Nízké riziko", value: 25, desc: "Bezpečné praktiky — správce hesel nebo silné obměny, 2FA, bezpečné sdílení." },
          { name: "Střední riziko", value: 66, desc: "Splňuje část praktik, ale má mezery — typicky chybí správce hesel nebo plné 2FA." },
          { name: "Vysoké riziko", value: 9, desc: "Kombinace rizikových praktik: slabá hesla, bez 2FA, nebezpečné sdílení dat." },
        ],
        topProblems: [
          { problem: "Produktivitní dluh (přepisování dat)", pct: 80, category: "Procesy" },
          { problem: "Hledání souborů a informací", pct: 62, category: "Data" },
          { problem: "Pomalé / nefunkční systémy", pct: 53, category: "Nástroje" },
          { problem: "Chybí pravidla komunikace", pct: 53, category: "Komunikace" },
          { problem: "Nevyužité AI funkce v M365", pct: 51, category: "Nástroje" },
          { problem: "Složité / neintuitivní systémy", pct: 42, category: "Nástroje" },
          { problem: "Přepínání mezi aplikacemi", pct: 39, category: "Produktivita" },
          { problem: "Lokální úložiště místo cloudu", pct: 37, category: "Data" },
          { problem: "Info pozdě nebo vůbec", pct: 29, category: "Komunikace" },
          { problem: "Nedostatek školení", pct: 24, category: "Vzdělávání" },
          { problem: "Nebezpečná správa hesel", pct: 22, category: "Bezpečnost" },
        ],
        recommendations: [
          { id: "C1.1", name: "Správce hesel + povinné 2FA", priority: "KRITICKÁ", horizon: "Okamžitě", category: "Bezpečnost", impact: "Eliminace kritického bezpečnostního rizika (skóre 7,1 %)" },
          { id: "C5.1", name: "SharePoint rozcestník", priority: "KRITICKÁ", horizon: "Okamžitě", category: "Data a dokumenty", impact: "Řešení problému s hledáním souborů (62,4 %)" },
          { id: "C1.2", name: "Bezpečnostní školení", priority: "VYSOKÁ", horizon: "Q1", category: "Bezpečnost", impact: "Zvýšení bezpečnostního povědomí a GDPR compliance" },
          { id: "C6.1", name: "Školení platformy a AI", priority: "VYSOKÁ", horizon: "Q1", category: "Vzdělávání", impact: "Aktivace AI funkcí v M365 a zvýšení kompetencí" },
          { id: "C4.1", name: "Pravidla komunikace", priority: "VYSOKÁ", horizon: "Q1", category: "Komunikace", impact: "Zlepšení informovanosti napříč organizací" },
          { id: "C1.3", name: "Pravidla pro data v AI", priority: "VYSOKÁ", horizon: "Q1", category: "Bezpečnost", impact: "Bezpečné využití AI s firemními daty" },
          { id: "C3.1", name: "Propojení tabulek a workflow", priority: "STŘEDNÍ", horizon: "Q2", category: "Procesy", impact: "Snížení produktivitního dluhu (z 80 %)" },
          { id: "C3.2", name: "Automatizace komunikace", priority: "STŘEDNÍ", horizon: "Q2", category: "Procesy", impact: "Copilot pro shrnutí e-mailů a zápisy z porad" },
          { id: "C2.1", name: "Audit a optimalizace systémů", priority: "STŘEDNÍ", horizon: "Q2", category: "Nástroje", impact: "Řešení pomalých systémů (52,9 %)" },
          { id: "C7.1", name: "Program digitálních ambasadorů", priority: "NÍZKÁ", horizon: "Q3–Q4", category: "Change management", impact: "Formalizace silného potenciálu (29,4 % ambasadorů)" },
          { id: "C7.2", name: "AI komunita a best practices", priority: "NÍZKÁ", horizon: "Q3–Q4", category: "Change management", impact: "Systematické sdílení AI know-how" },
        ],
        educationPrefs: [
          { name: "Krátká videa", value: 57 },
          { name: "Peer learning", value: 48 },
          { name: "Osobní workshop", value: 39 },
          { name: "Online workshop", value: 29 },
          { name: "Individuální koučink", value: 22 },
          { name: "Písemné postupy", value: 20 },
        ],
        educationMatrix: [
          { area: "Bezpečnost", priority: "POVINNÉ", target: "Všichni (100 %)", form: "E-learning + test", scope: "2 hodiny" },
          { area: "Platforma — základy", priority: "Vysoká", target: "Všichni uživatelé", form: "Workshop + videa", scope: "4 hodiny" },
          { area: "AI v praxi", priority: "Vysoká", target: "Zájemci (84,7 %)", form: "Workshop + peer learning", scope: "4 hodiny" },
          { area: "Platforma — pokročilé", priority: "Vysoká", target: "Ambasadoři, vedoucí", form: "Workshop + mentoring", scope: "8 hodin" },
          { area: "Excel a práce s daty", priority: "Střední", target: "Zájemci (54,1 %)", form: "Workshop + praxe", scope: "4 hodiny" },
          { area: "Automatizace workflow", priority: "Střední", target: "Zájemci (45,9 %)", form: "Workshop + piloty", scope: "4 hodiny" },
          { area: "Specifické systémy", priority: "Dle potřeby", target: "Uživatelé systému", form: "Individuální coaching", scope: "2–4 hodiny" },
        ],
        radarData: [
          { area: "AI adopce", score: 78 },
          { area: "Bezpečnost", score: 7 },
          { area: "Produktivita", score: 20 },
          { area: "Komunikace", score: 54 },
          { area: "Nástroje", score: 70 },
          { area: "Ochota ke změně", score: 79 },
          { area: "Vzdělávání", score: 66 },
        ],
      };

      // === COMPONENTS ===

      function MetricCard(props) {
        var m = props.metric;
        var statusColors = { ok: COLORS.success, warning: COLORS.warning, critical: COLORS.critical };
        var statusLabels = { ok: "✓ V pořádku", warning: "⚠ Pozor", critical: "✕ Kritické" };
        var statusEmoji = { ok: "🟢", warning: "🟡", critical: "🔴" };
        var color = statusColors[m.status] || COLORS.secondary;
        return e("div", { style: { background: COLORS.card, borderRadius: 10, padding: "18px 20px", borderLeft: "4px solid " + color, boxShadow: "0 1px 4px rgba(0,0,0,0.06)", fontFamily: font }},
          e("div", { style: { fontSize: 12, color: COLORS.textLight, marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.5 }}, m.name),
          e("div", { style: { display: "flex", alignItems: "baseline", gap: 4 }},
            e("span", { style: { fontSize: 30, fontWeight: 700, color: color }}, m.value),
            e("span", { style: { fontSize: 14, color: COLORS.textLight }}, m.unit)),
          e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }},
            e("span", { style: { fontSize: 11, color: COLORS.textLight }}, "Cíl: " + m.target + m.unit + (m.inverse ? " ↓" : "")),
            e("span", { style: { fontSize: 11, fontWeight: 600, color: color }}, statusEmoji[m.status] + " " + statusLabels[m.status])));
      }

      function PieSec(props) {
        var data = props.data, colors = props.colors, title = props.title;
        return e("div", { style: { background: COLORS.card, borderRadius: 10, padding: 24, boxShadow: "0 1px 4px rgba(0,0,0,0.06)", fontFamily: font }},
          e("h3", { style: { fontSize: 15, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0" }}, title),
          e("div", { style: { display: "flex", alignItems: "flex-start", gap: 20 }},
            e("div", { style: { width: 150, height: 150, flexShrink: 0 }},
              e(ResponsiveContainer, { width: "100%", height: "100%" },
                e(PieChart, null,
                  e(Pie, { data: data, dataKey: "value", nameKey: "name", cx: "50%", cy: "50%", innerRadius: 38, outerRadius: 68, paddingAngle: 2, strokeWidth: 0 },
                    data.map(function(_, i) { return e(Cell, { key: i, fill: colors[i % colors.length] }); })),
                  e(Tooltip, { formatter: function(v) { return v + " %"; } })))),
            e("div", { style: { flex: 1 }},
              data.map(function(item, i) {
                return e("div", { key: i, style: { marginBottom: 10 }},
                  e("div", { style: { display: "flex", alignItems: "center", gap: 8 }},
                    e("div", { style: { width: 10, height: 10, borderRadius: "50%", background: colors[i % colors.length], flexShrink: 0 }}),
                    e("span", { style: { fontSize: 13, fontWeight: 600, color: COLORS.text }}, item.name),
                    e("span", { style: { fontSize: 13, fontWeight: 700, color: colors[i % colors.length], marginLeft: "auto" }}, item.value + " %")),
                  item.desc ? e("div", { style: { fontSize: 11, color: COLORS.textLight, marginLeft: 18, marginTop: 2, lineHeight: 1.4 }}, item.desc) : null);
              }))));
      }

      function PriorityBadge(props) {
        var map = { "KRITICKÁ": { bg: "#fde8e8", color: COLORS.critical }, "VYSOKÁ": { bg: "#fef3cd", color: COLORS.warning }, "STŘEDNÍ": { bg: "#e8f4fd", color: COLORS.secondary }, "NÍZKÁ": { bg: "#e8f8ef", color: COLORS.success } };
        var s = map[props.priority] || map["STŘEDNÍ"];
        return e("span", { style: { background: s.bg, color: s.color, padding: "3px 10px", borderRadius: 12, fontSize: 11, fontWeight: 700, whiteSpace: "nowrap" }}, props.priority);
      }

      // === MAIN DASHBOARD ===

      function Dashboard() {
        var tabState = React.useState("overview");
        var activeTab = tabState[0];
        var setActiveTab = tabState[1];
        var data = DATA;

        var tabs = [
          { id: "overview", label: "Přehled" },
          { id: "segments", label: "Segmentace" },
          { id: "problems", label: "Problémy" },
          { id: "recommendations", label: "Doporučení" },
          { id: "education", label: "Vzdělávání" },
        ];

        return e("div", { style: { minHeight: "100vh", background: COLORS.bg, fontFamily: font }},

          // Header
          e("div", { style: { background: COLORS.primary, color: "#fff", padding: "28px 32px 24px" }},
            e("div", { style: { display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }},
              e("div", { style: { width: 6, height: 28, background: COLORS.accent, borderRadius: 3 }}),
              e("span", { style: { fontSize: 12, textTransform: "uppercase", letterSpacing: 2, opacity: 0.7 }}, "Digitální audit")),
            e("h1", { style: { fontSize: 26, fontWeight: 700, margin: "8px 0 0 0" }}, data.orgName),
            e("div", { style: { display: "flex", gap: 24, fontSize: 13, opacity: 0.8, marginTop: 10 }},
              e("span", null, "Období: " + data.date),
              e("span", null, "Respondentů: " + data.respondents.total + " z " + data.respondents.employees + " (" + data.respondents.rate + " %)"))),

          // Tabs
          e("div", { style: { background: COLORS.card, borderBottom: "1px solid " + COLORS.border, display: "flex", gap: 0, padding: "0 32px" }},
            tabs.map(function(t) {
              return e("button", {
                key: t.id,
                onClick: function() { setActiveTab(t.id); },
                style: {
                  padding: "14px 22px", border: "none", background: "none", cursor: "pointer",
                  fontSize: 14, fontFamily: font,
                  fontWeight: activeTab === t.id ? 700 : 400,
                  color: activeTab === t.id ? COLORS.primary : COLORS.textLight,
                  borderBottom: activeTab === t.id ? "3px solid " + COLORS.accent : "3px solid transparent",
                  transition: "all 0.2s",
                }
              }, t.label);
            })),

          // Content
          e("div", { style: { padding: "28px 32px", maxWidth: 1200 }},

            // OVERVIEW
            activeTab === "overview" ? e("div", null,
              e("h2", { style: { fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0" }}, "Baseline metriky"),
              e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12, marginBottom: 32 }},
                data.baselineMetrics.map(function(m, i) { return e(MetricCard, { key: i, metric: m }); })),
              e("h2", { style: { fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0" }}, "Radarový profil organizace"),
              e("div", { style: { background: COLORS.card, borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }},
                e(ResponsiveContainer, { width: "100%", height: 360 },
                  e(RadarChart, { data: data.radarData },
                    e(PolarGrid, { stroke: COLORS.border }),
                    e(PolarAngleAxis, { dataKey: "area", tick: { fontSize: 12, fill: COLORS.text, fontFamily: font } }),
                    e(PolarRadiusAxis, { angle: 30, domain: [0, 100], tick: { fontSize: 10 } }),
                    e(Radar, { name: "Organizace", dataKey: "score", stroke: COLORS.primary, fill: COLORS.secondary, fillOpacity: 0.3, strokeWidth: 2 }),
                    e(Legend, null),
                    e(Tooltip, null)))))
            : null,

            // SEGMENTS
            activeTab === "segments" ? e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }},
              e(PieSec, { data: data.changeSegments, colors: SEGMENT_COLORS, title: "Postoj ke změnám" }),
              e(PieSec, { data: data.aiSegments, colors: AI_COLORS, title: "AI adopce" }),
              e("div", { style: { gridColumn: "1 / -1" }},
                e(PieSec, { data: data.securitySegments, colors: SECURITY_COLORS, title: "Bezpečnostní riziko" })))
            : null,

            // PROBLEMS
            activeTab === "problems" ? e("div", null,
              e("h2", { style: { fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0" }}, "Top identifikované problémy"),
              e("div", { style: { background: COLORS.card, borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }},
                e(ResponsiveContainer, { width: "100%", height: Math.max(300, data.topProblems.length * 46) },
                  e(BarChart, { data: data.topProblems.slice().sort(function(a, b) { return b.pct - a.pct; }), layout: "vertical", margin: { left: 220, right: 40 } },
                    e(CartesianGrid, { strokeDasharray: "3 3", stroke: COLORS.border }),
                    e(XAxis, { type: "number", domain: [0, 100], tick: { fontSize: 12, fontFamily: font }, unit: " %" }),
                    e(YAxis, { dataKey: "problem", type: "category", tick: { fontSize: 12, fill: COLORS.text, fontFamily: font }, width: 210 }),
                    e(Tooltip, { formatter: function(v) { return v + " %"; } }),
                    e(Bar, { dataKey: "pct", radius: [0, 4, 4, 0] },
                      data.topProblems.slice().sort(function(a, b) { return b.pct - a.pct; }).map(function(item, i) {
                        return e(Cell, { key: i, fill: item.pct >= 60 ? COLORS.critical : item.pct >= 40 ? COLORS.warning : COLORS.secondary });
                      }))))),
              e("div", { style: { display: "flex", gap: 20, marginTop: 14, justifyContent: "center" }},
                [{ label: "Kritické (60 %+)", color: COLORS.critical }, { label: "Významné (40–59 %)", color: COLORS.warning }, { label: "Sledovat (< 40 %)", color: COLORS.secondary }].map(function(l, i) {
                  return e("div", { key: i, style: { display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: COLORS.textLight }},
                    e("div", { style: { width: 12, height: 12, borderRadius: 2, background: l.color }}), l.label);
                })))
            : null,

            // RECOMMENDATIONS
            activeTab === "recommendations" ? e("div", null,
              e("h2", { style: { fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0" }}, "Prioritizovaná doporučení"),
              e("div", { style: { display: "flex", flexDirection: "column", gap: 8 }},
                data.recommendations.map(function(r, i) {
                  var bc = r.priority === "KRITICKÁ" ? COLORS.critical : r.priority === "VYSOKÁ" ? COLORS.warning : r.priority === "NÍZKÁ" ? COLORS.success : COLORS.secondary;
                  return e("div", { key: i, style: { background: COLORS.card, borderRadius: 8, padding: "14px 20px", display: "flex", alignItems: "center", gap: 14, boxShadow: "0 1px 3px rgba(0,0,0,0.05)", borderLeft: "3px solid " + bc, fontFamily: font }},
                    e("span", { style: { fontSize: 13, fontWeight: 700, color: COLORS.primary, minWidth: 48 }}, r.id),
                    e("div", { style: { flex: 1 }},
                      e("div", { style: { fontSize: 14, color: COLORS.text, fontWeight: 500 }}, r.name),
                      e("div", { style: { fontSize: 11, color: COLORS.textLight, marginTop: 2 }}, r.impact)),
                    e(PriorityBadge, { priority: r.priority }),
                    e("span", { style: { fontSize: 12, color: COLORS.textLight, minWidth: 70, textAlign: "right" }}, r.horizon),
                    e("span", { style: { fontSize: 12, color: COLORS.primary, minWidth: 130, textAlign: "right", fontWeight: 500 }}, r.category));
                })))
            : null,

            // EDUCATION
            activeTab === "education" ? e("div", null,
              e("h2", { style: { fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0" }}, "Preferované formy vzdělávání"),
              e("div", { style: { background: COLORS.card, borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }},
                e(ResponsiveContainer, { width: "100%", height: 280 },
                  e(BarChart, { data: data.educationPrefs, margin: { left: 20, right: 40 } },
                    e(CartesianGrid, { strokeDasharray: "3 3", stroke: COLORS.border }),
                    e(XAxis, { dataKey: "name", tick: { fontSize: 12, fill: COLORS.text, fontFamily: font } }),
                    e(YAxis, { domain: [0, 100], tick: { fontSize: 12, fontFamily: font }, unit: " %" }),
                    e(Tooltip, { formatter: function(v) { return v + " %"; } }),
                    e(Bar, { dataKey: "value", fill: COLORS.secondary, radius: [4, 4, 0, 0] })))),
              e("h2", { style: { fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "28px 0 16px 0" }}, "Vzdělávací matice"),
              e("div", { style: { background: COLORS.card, borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }},
                e("table", { style: { width: "100%", borderCollapse: "collapse", fontSize: 13, fontFamily: font }},
                  e("thead", null,
                    e("tr", { style: { background: COLORS.primary }},
                      ["Oblast", "Priorita", "Cílová skupina", "Forma", "Rozsah"].map(function(h, i) {
                        return e("th", { key: i, style: { padding: "12px 16px", color: "#fff", fontWeight: 600, textAlign: "left" }}, h);
                      }))),
                  e("tbody", null,
                    data.educationMatrix.map(function(row, i) {
                      return e("tr", { key: i, style: { background: i % 2 === 0 ? COLORS.card : COLORS.bg }},
                        e("td", { style: { padding: "10px 16px", fontWeight: 600, color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}, row.area),
                        e("td", { style: { padding: "10px 16px", fontWeight: row.priority === "POVINNÉ" ? 700 : 400, color: row.priority === "POVINNÉ" ? COLORS.critical : COLORS.text, borderBottom: "1px solid " + COLORS.border }}, row.priority),
                        e("td", { style: { padding: "10px 16px", color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}, row.target),
                        e("td", { style: { padding: "10px 16px", color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}, row.form),
                        e("td", { style: { padding: "10px 16px", color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}, row.scope));
                    })))))
            : null
          ),

          // Footer
          e("div", { style: { padding: "16px 32px", borderTop: "1px solid " + COLORS.border, fontSize: 11, color: COLORS.textLight, display: "flex", justifyContent: "space-between", fontFamily: font }},
            e("span", null, "Digitální audit — " + data.orgName + " | Zpracovala: Mgr. Kateřina Švidrnochová"),
            e("span", null, "Důvěrné — pouze pro interní použití"))
        );
      }

      root.render(e(Dashboard, null));
    })();
  </script>
</body>
</html>
