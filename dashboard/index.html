const MetricCard = ({ m }) => {
  const sc = { ok: COLORS.success, warning: COLORS.warning, critical: COLORS.critical };

  const color = sc[m.status];
  return (
    <div style={{ background: COLORS.card, borderRadius: 10, padding: "18px 20px", borderLeft: "4px solid " + color, boxShadow: "0 1px 4px rgba(0,0,0,0.06)", fontFamily: font }}>
      <div style={{ fontSize: 12, color: COLORS.textLight, marginBottom: 6, textTransform: "uppercase", letterSpacing: 0.5 }}>{m.name}</div>

};

      <div style={{ flex: 1 }}>{data.map((item, i) => (
        <div key={i} style={{ marginBottom: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ width: 10, height: 10, borderRadius: "50%", background: colors[i % colors.length], flexShrink: 0 }} /><span style={{ fontSize: 13, fontWeight: 600, color: COLORS.text }}>{item.name}</span><span style={{ fontSize: 13, fontWeight: 700, color: colors[i % colors.length], marginLeft: "auto" }}>{item.value} %</span></div>
          {item.desc && <div style={{ fontSize: 11, color: COLORS.textLight, marginLeft: 18, marginTop: 2, lineHeight: 1.4 }}>{item.desc}</div>}
        </div>
      ))}</div>
    </div>
  </div>
);

const UseCaseCard = ({ uc }) => {
  const ic = { high: COLORS.critical, medium: COLORS.warning, low: COLORS.secondary };
  const il = { high: "Vysoký dopad", medium: "Střední dopad", low: "Nižší dopad" };
  return (
    <div style={{ background: COLORS.card, borderRadius: 10, padding: "20px 24px", boxShadow: "0 1px 4px rgba(0,0,0,0.06)", borderLeft: "4px solid " + ic[uc.impact], fontFamily: font }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
        <span style={{ background: COLORS.primary, color: "#fff", padding: "2px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700 }}>{uc.id}</span>
        <span style={{ fontSize: 15, fontWeight: 700, color: COLORS.text }}>{uc.title}</span>
        <span style={{ marginLeft: "auto", background: ic[uc.impact] + "18", color: ic[uc.impact], padding: "2px 10px", borderRadius: 10, fontSize: 10, fontWeight: 600 }}>{il[uc.impact]}</span>
      </div>
      <div style={{ background: "#f8fafc", borderRadius: 8, padding: "12px 16px", marginBottom: 12, borderLeft: "3px solid " + COLORS.accent }}>
        <div style={{ fontSize: 12, color: COLORS.text, fontStyle: "italic", lineHeight: 1.5, marginBottom: uc.quote2 ? 6 : 0 }}>{"\u201E"}{uc.quote}{"\u201C"}</div>
        {uc.quote2 && <div style={{ fontSize: 12, color: COLORS.textLight, fontStyle: "italic", lineHeight: 1.5 }}>{"\u201E"}{uc.quote2}{"\u201C"}</div>}
      </div>
      <div style={{ fontSize: 12, marginBottom: 10 }}><span style={{ color: COLORS.textLight, fontWeight: 600 }}>Oddělení: </span><span style={{ color: COLORS.text }}>{uc.dept}</span></div>
      <div style={{ background: "#f0fdf4", borderRadius: 8, padding: "10px 14px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.success, marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.5 }}>Návrh řešení</div>
        <div style={{ fontSize: 12, color: COLORS.text, lineHeight: 1.5 }}>{uc.solution}</div>
      </div>
    </div>
  );
};

const TimelineView = () => {
  const streams = DATA.streams;
  const mw = 120, sw = 200;
  return (
    <div>
      <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Tři paralelní oblasti spolupráce</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 28 }}>
        {streams.map(s => (
          <div key={s.id} style={{ background: COLORS.card, borderRadius: 10, padding: "20px 22px", borderTop: "4px solid " + s.color, boxShadow: "0 1px 4px rgba(0,0,0,0.06)", fontFamily: font }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: s.color, marginBottom: 6 }}>{s.name}</div>
            <div style={{ fontSize: 12, color: COLORS.textLight, lineHeight: 1.5, marginBottom: 10 }}>{s.desc}</div>
            <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.text }}>{s.events.length}</div>
            <div style={{ fontSize: 11, color: COLORS.textLight }}>plánovaných setkání</div>
          </div>
        ))}
      </div>
      <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Harmonogram únor – září 2026</h2>
      <div style={{ background: COLORS.card, borderRadius: 10, padding: "20px 0", boxShadow: "0 1px 4px rgba(0,0,0,0.06)", overflowX: "auto" }}>
        <div style={{ minWidth: sw + MONTHS_TL.length * mw, position: "relative" }}>
          <div style={{ display: "flex", marginLeft: sw, borderBottom: "1px solid " + COLORS.border, marginBottom: 8 }}>
            {MONTHS_TL.map((m, i) => <div key={i} style={{ width: mw, textAlign: "center", fontSize: 12, fontWeight: 600, color: COLORS.primary, padding: "8px 0", borderLeft: "1px solid " + COLORS.border, fontFamily: font }}>{m}</div>)}
          </div>
          {streams.map((s, si) => (
            <div key={s.id} style={{ display: "flex", alignItems: "stretch", minHeight: 56, borderBottom: si < streams.length - 1 ? "1px solid " + COLORS.border : "none" }}>
              <div style={{ width: sw, flexShrink: 0, display: "flex", alignItems: "center", padding: "8px 16px", gap: 8 }}>
                <div style={{ width: 12, height: 12, borderRadius: "50%", background: s.color, flexShrink: 0 }} />
                <span style={{ fontSize: 12, fontWeight: 600, color: COLORS.text, fontFamily: font }}>{s.name}</span>
              </div>
              <div style={{ flex: 1, position: "relative", display: "flex", minHeight: 48 }}>
                {MONTHS_TL.map((_, i) => <div key={i} style={{ width: mw, borderLeft: "1px solid " + COLORS.border, flexShrink: 0 }} />)}
                {s.events.map((ev, ei) => {
                  const mo = parseMonth(ev.date);
                  let mi = MONTH_NUMS.indexOf(mo); if (mi < 0) mi = MONTH_NUMS.length - 1;
                  const day = parseInt(ev.date.split(".")[0]) || 15;
                  const xOff = mi * mw + (day / 31) * mw;
                  const ds = ev.type === "milestone" ? 16 : ev.type === "workshop" ? 14 : 10;
                  const dr = ev.type === "milestone" || ev.type === "workshop" ? "2px" : "50%";
                  return <div key={ei} title={ev.date + " — " + ev.label} style={{ position: "absolute", left: xOff - ds / 2, top: "50%", transform: "translateY(-50%)", width: ds, height: ds, borderRadius: dr, background: s.color, border: ev.type === "milestone" ? "2px solid " + COLORS.accent : "none", cursor: "default", zIndex: 2 }} />;
                })}
              </div>
            </div>
          ))}
        </div>
      </div>
      <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "28px 0 16px 0", fontFamily: font }}>Detailní plán setkání</h2>
      {streams.map(s => (
        <div key={s.id} style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <div style={{ width: 14, height: 14, borderRadius: "50%", background: s.color }} />
            <h3 style={{ fontSize: 15, fontWeight: 700, color: s.color, fontFamily: font }}>{s.name}</h3>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {s.events.map((ev, ei) => {
              const isF = ei === 0 && s.id === "akademie";
              return (
                <div key={ei} style={{ background: COLORS.card, borderRadius: 8, padding: "12px 18px", display: "flex", alignItems: "center", gap: 14, boxShadow: "0 1px 3px rgba(0,0,0,0.05)", borderLeft: "3px solid " + (isF ? COLORS.accent : s.color), fontFamily: font }}>
                  <div style={{ minWidth: 100, fontSize: 13, fontWeight: 600, color: COLORS.primary }}>{ev.date}</div>
                  <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: isF ? 700 : 500, color: COLORS.text }}>{ev.label}</div><div style={{ fontSize: 11, color: COLORS.textLight, marginTop: 2 }}>{ev.detail}</div></div>
                  <StatusBadge status={ev.status} />
                  {ev.type === "milestone" && <span style={{ fontSize: 16 }}>⭐</span>}
                  {ev.type === "workshop" && <span style={{ fontSize: 16 }}>🏢</span>}
                </div>
              );
            })}
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 24, marginTop: 16, padding: "14px 20px", background: COLORS.card, borderRadius: 8, boxShadow: "0 1px 3px rgba(0,0,0,0.05)", flexWrap: "wrap", fontFamily: font }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.textLight }}>Legenda:</div>
        {[{ icon: "⭐", label: "Milník / kick-off" }, { icon: "🏢", label: "Prezenční workshop" }, { icon: "●", label: "Online setkání" }].map((l, i) =>
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: COLORS.textLight }}><span>{l.icon}</span>{l.label}</div>
        )}
      </div>
    </div>
  );
};

function Dashboard() {
  const [activeTab, setActiveTab] = useState("overview");
  const [ucFilter, setUcFilter] = useState("all");
  const tabs = [{ id: "overview", label: "Přehled" }, { id: "segments", label: "Segmentace" }, { id: "problems", label: "Problémy" }, { id: "usecases", label: "Use Cases" }, { id: "recommendations", label: "Doporučení" }, { id: "education", label: "Vzdělávání" }, { id: "harmonogram", label: "Harmonogram" }];
  const ucCats = [{ id: "all", label: "Vše" }, { id: "A", label: "Přepisování dat" }, { id: "B", label: "Reporty a KPI" }, { id: "C", label: "Komunikace" }, { id: "D", label: "Systémy" }, { id: "G", label: "Organizační" }];
  const filteredUC = ucFilter === "all" ? DATA.useCases : DATA.useCases.filter(uc => uc.category === ucFilter);

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: font }}>
      {/* Header */}
      <div style={{ background: COLORS.primary, color: "#fff", padding: "28px 32px 24px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}><div style={{ width: 6, height: 28, background: COLORS.accent, borderRadius: 3 }} /><span style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 2, opacity: 0.7 }}>Digitální audit</span></div>
        <h1 style={{ fontSize: 26, fontWeight: 700, margin: "8px 0 0 0" }}>{DATA.orgName}</h1>
        <div style={{ display: "flex", gap: 24, fontSize: 13, opacity: 0.8, marginTop: 10 }}><span>Období: {DATA.date}</span><span>Respondentů: {DATA.respondents.total} z {DATA.respondents.employees} ({DATA.respondents.rate} %)</span></div>
      </div>
      {/* Tabs */}
      <div style={{ background: COLORS.card, borderBottom: "1px solid " + COLORS.border, display: "flex", gap: 0, padding: "0 32px", overflowX: "auto" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ padding: "14px 18px", border: "none", background: "none", cursor: "pointer", fontSize: 13, whiteSpace: "nowrap", fontFamily: font, fontWeight: activeTab === t.id ? 700 : 400, color: activeTab === t.id ? COLORS.primary : COLORS.textLight, borderBottom: activeTab === t.id ? "3px solid " + COLORS.accent : "3px solid transparent" }}>{t.label}</button>
        ))}
      </div>
      {/* Content */}
      <div style={{ padding: "28px 32px", maxWidth: 1200 }}>
        {activeTab === "overview" && (
          <div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Baseline metriky</h2>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12, marginBottom: 32 }}>{DATA.baselineMetrics.map((m, i) => <MetricCard key={i} m={m} />)}</div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Radarový profil organizace</h2>
            <div style={{ background: COLORS.card, borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              <ResponsiveContainer width="100%" height={360}><RadarChart data={DATA.radarData}><PolarGrid stroke={COLORS.border} /><PolarAngleAxis dataKey="area" tick={{ fontSize: 12, fill: COLORS.text, fontFamily: font }} /><PolarRadiusAxis angle={30} domain={[0, 100]} tick={{ fontSize: 10 }} /><Radar name="Organizace" dataKey="score" stroke={COLORS.primary} fill={COLORS.secondary} fillOpacity={0.3} strokeWidth={2} /><Legend /><Tooltip /></RadarChart></ResponsiveContainer>
            </div>
          </div>
        )}
        {activeTab === "segments" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <PieSec data={DATA.changeSegments} colors={SEG_C} title="Postoj ke změnám" />
            <PieSec data={DATA.aiSegments} colors={SEG_C} title="AI adopce" />
            <div style={{ gridColumn: "1 / -1" }}><PieSec data={DATA.securitySegments} colors={SEC_C} title="Bezpečnostní riziko" /></div>
          </div>
        )}
        {activeTab === "problems" && (
          <div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Top identifikované problémy</h2>
            <div style={{ background: COLORS.card, borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              <ResponsiveContainer width="100%" height={Math.max(300, DATA.topProblems.length * 46)}>
                <BarChart data={[...DATA.topProblems].sort((a, b) => b.pct - a.pct)} layout="vertical" margin={{ left: 220, right: 40 }}><CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} /><XAxis type="number" domain={[0, 100]} tick={{ fontSize: 12, fontFamily: font }} unit=" %" /><YAxis dataKey="problem" type="category" tick={{ fontSize: 12, fill: COLORS.text, fontFamily: font }} width={210} /><Tooltip formatter={v => v + " %"} /><Bar dataKey="pct" radius={[0, 4, 4, 0]}>{[...DATA.topProblems].sort((a, b) => b.pct - a.pct).map((item, i) => <Cell key={i} fill={item.pct >= 60 ? COLORS.critical : item.pct >= 40 ? COLORS.warning : COLORS.secondary} />)}</Bar></BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        )}
        {activeTab === "usecases" && (
          <div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 6px 0", fontFamily: font }}>Use Cases pro optimalizaci</h2>
            <p style={{ fontSize: 13, color: COLORS.textLight, marginBottom: 16, lineHeight: 1.5, fontFamily: font }}>Reálné příklady neefektivit identifikované zaměstnanci v digitálním auditu. Každý use case obsahuje citaci respondenta, dotčená oddělení a návrh řešení.</p>
            <div style={{ display: "flex", gap: 6, marginBottom: 20, flexWrap: "wrap" }}>
              {ucCats.map(cat => (<button key={cat.id} onClick={() => setUcFilter(cat.id)} style={{ padding: "6px 16px", border: "1px solid " + (ucFilter === cat.id ? COLORS.primary : COLORS.border), background: ucFilter === cat.id ? COLORS.primary : COLORS.card, color: ucFilter === cat.id ? "#fff" : COLORS.text, borderRadius: 20, cursor: "pointer", fontSize: 12, fontWeight: ucFilter === cat.id ? 600 : 400, fontFamily: font }}>{cat.label}</button>))}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>{filteredUC.map(uc => <UseCaseCard key={uc.id} uc={uc} />)}</div>
            <div style={{ marginTop: 20, background: COLORS.card, borderRadius: 10, padding: "16px 22px", display: "flex", gap: 32, boxShadow: "0 1px 4px rgba(0,0,0,0.06)", flexWrap: "wrap", fontFamily: font }}>
              <div><div style={{ fontSize: 28, fontWeight: 700, color: COLORS.critical }}>80 %</div><div style={{ fontSize: 11, color: COLORS.textLight }}>zaměstnanců přepisuje data</div></div>
              <div><div style={{ fontSize: 28, fontWeight: 700, color: COLORS.primary }}>10+</div><div style={{ fontSize: 11, color: COLORS.textLight }}>dotčených oddělení</div></div>
              <div><div style={{ fontSize: 28, fontWeight: 700, color: COLORS.success }}>7</div><div style={{ fontSize: 11, color: COLORS.textLight }}>kategorií use cases</div></div>
              <div><div style={{ fontSize: 28, fontWeight: 700, color: COLORS.warning }}>Q1–Q3</div><div style={{ fontSize: 11, color: COLORS.textLight }}>horizont řešení</div></div>
            </div>
          </div>
        )}
        {activeTab === "recommendations" && (
          <div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Prioritizovaná doporučení</h2>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {DATA.recommendations.map((r, i) => {
                const bc = r.priority === "KRITICKÁ" ? COLORS.critical : r.priority === "VYSOKÁ" ? COLORS.warning : r.priority === "NÍZKÁ" ? COLORS.success : COLORS.secondary;
                return (
                  <div key={i} style={{ background: COLORS.card, borderRadius: 8, padding: "14px 20px", display: "flex", alignItems: "center", gap: 14, boxShadow: "0 1px 3px rgba(0,0,0,0.05)", borderLeft: "3px solid " + bc, fontFamily: font }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: COLORS.primary, minWidth: 48 }}>{r.id}</span>
                    <div style={{ flex: 1 }}><div style={{ fontSize: 14, color: COLORS.text, fontWeight: 500 }}>{r.name}</div><div style={{ fontSize: 11, color: COLORS.textLight, marginTop: 2 }}>{r.impact}</div></div>
                    <PriorityBadge priority={r.priority} />
                    <span style={{ fontSize: 12, color: COLORS.textLight, minWidth: 70, textAlign: "right" }}>{r.horizon}</span>
                    <span style={{ fontSize: 12, color: COLORS.primary, minWidth: 110, textAlign: "right", fontWeight: 500 }}>{r.category}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {activeTab === "education" && (
          <div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "0 0 16px 0", fontFamily: font }}>Preferované formy vzdělávání</h2>
            <div style={{ background: COLORS.card, borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              <ResponsiveContainer width="100%" height={280}><BarChart data={DATA.educationPrefs} margin={{ left: 20, right: 40 }}><CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} /><XAxis dataKey="name" tick={{ fontSize: 12, fill: COLORS.text, fontFamily: font }} /><YAxis domain={[0, 100]} tick={{ fontSize: 12, fontFamily: font }} unit=" %" /><Tooltip formatter={v => v + " %"} /><Bar dataKey="value" fill={COLORS.secondary} radius={[4, 4, 0, 0]} /></BarChart></ResponsiveContainer>
            </div>
            <h2 style={{ fontSize: 18, fontWeight: 700, color: COLORS.primary, margin: "28px 0 16px 0", fontFamily: font }}>Vzdělávací matice</h2>
            <div style={{ background: COLORS.card, borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, fontFamily: font }}>
                <thead><tr style={{ background: COLORS.primary }}>{["Oblast", "Priorita", "Cílová skupina", "Forma", "Rozsah"].map((h, i) => <th key={i} style={{ padding: "12px 16px", color: "#fff", fontWeight: 600, textAlign: "left" }}>{h}</th>)}</tr></thead>
                <tbody>{DATA.educationMatrix.map((row, i) => (<tr key={i} style={{ background: i % 2 === 0 ? COLORS.card : COLORS.bg }}><td style={{ padding: "10px 16px", fontWeight: 600, color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}>{row.area}</td><td style={{ padding: "10px 16px", fontWeight: row.priority === "POVINNÉ" ? 700 : 400, color: row.priority === "POVINNÉ" ? COLORS.critical : COLORS.text, borderBottom: "1px solid " + COLORS.border }}>{row.priority}</td><td style={{ padding: "10px 16px", color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}>{row.target}</td><td style={{ padding: "10px 16px", color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}>{row.form}</td><td style={{ padding: "10px 16px", color: COLORS.text, borderBottom: "1px solid " + COLORS.border }}>{row.scope}</td></tr>))}</tbody>
              </table>
            </div>
          </div>
        )}
        {activeTab === "harmonogram" && <TimelineView />}
      </div>
      {/* Footer */}
      <div style={{ padding: "16px 32px", borderTop: "1px solid " + COLORS.border, fontSize: 11, color: COLORS.textLight, display: "flex", justifyContent: "space-between", fontFamily: font }}>
        <span>Digitální audit — {DATA.orgName} | Zpracovala: Mgr. Kateřina Švidrnochová</span>
        <span>Důvěrné — pouze pro interní použití</span>
      </div>
    </div>
  );
}

ReactDOM.render(<Dashboard />, document.getElementById('root'));
</script>
</body>
</html>
